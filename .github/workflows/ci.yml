name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # A zip -> Windows-unzip -> git-commit round trip can drop the exec
      # bit on gradlew (NTFS has no Unix executable bit, and Windows git's
      # core.fileMode handling of that is inconsistent), which fails as
      # "Permission denied" / exit 126 here regardless of what's actually
      # recorded in the git tree. Cheap and fully idempotent to just force
      # it before every run instead of relying on the committed mode.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests (all modules)
        run: ./gradlew testDebugUnitTest test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voicescribe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  instrumented-tests:
    # Not required for a debug APK -- that comes from build-lint-test above.
    # This job runs the actual on-device/emulator Compose UI + Espresso
    # suite. Emulator boot on shared CI runners is notoriously the flakiest
    # part of any Android CI setup; continue-on-error keeps a slow/flaky
    # boot from reading as "the app is broken" when it isn't. The api-30 /
    # x86_64 / macos-13 combination below is the most widely used, longest-
    # documented configuration for reactivecircus/android-emulator-runner --
    # swapped in after api-34/arm64-v8a/macos-14 (Apple Silicon) repeatedly
    # timed out; that newer combination has less real-world mileage behind
    # it. Re-run this job (or bump api-level/arch back up) if you want to
    # try the newer target once GitHub's arm64 macOS image matures.
    runs-on: macos-13
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Caches the AVD + system image across runs so only the very first run
      # pays for a cold emulator boot; every run after that restores a
      # snapshot instead of creating+booting from scratch, which is the
      # single biggest lever against "Timeout waiting for emulator to boot".
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-google_apis-x86_64-v1

      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: false
          script: echo "AVD created."

      - name: Run instrumented tests (Compose UI, Espresso)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
