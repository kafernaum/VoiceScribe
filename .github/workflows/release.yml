name: Release

# Triggered by pushing a tag like `v1.2.0`. Requires these repository
# secrets to be configured (see RELEASE_CHECKLIST.md):
#   UPLOAD_KEYSTORE_BASE64  - `base64 -w0 upload-keystore.jks`
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   PLAY_CONSOLE_JSON_KEY   - Google Play Console service account JSON

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: fastlane

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Write Play Console service account key
        env:
          PLAY_CONSOLE_JSON_KEY: ${{ secrets.PLAY_CONSOLE_JSON_KEY }}
        run: echo "$PLAY_CONSOLE_JSON_KEY" > play-console-key.json

      - name: Upload to Play Console (internal track) via fastlane supply
        working-directory: fastlane
        run: bundle exec fastlane deploy_internal

      - name: Upload AAB as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Clean up secrets from disk
        if: always()
        run: rm -f app/upload-keystore.jks play-console-key.json
